[package]
name = "english-input-assistant"
version = "0.1.0"
description = "A desktop app that turns selected Japanese or English text into natural English using Google Gemini."
authors = ["Aki Hamano"]
license = "GPL-2.0-or-later"
repository = "https://github.com/t-hamano/english-input-assistant"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "english_input_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.1"
arboard = "3.6.1"
enigo = "0.6"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
rodio = "0.19"
base64 = "0.22.1"
keyring = { version = "4.2.0", features = ["v1"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser"] }

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
