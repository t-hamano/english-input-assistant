name: Test Rust

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/test-rust.yml'
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - '.github/workflows/test-rust.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  rust-test:
    name: Rust lint and unit tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          workspaces: ./src-tauri -> target
          key: rust-test

      # webkit2gtk/appindicator/rsvg: Tauri + tray icon.
      # libxdo: enigo (keyboard/mouse synthesis). libasound2: rodio (audio playback).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libasound2-dev

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test --lib
